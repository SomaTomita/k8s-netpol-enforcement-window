name: smoke

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    name: kind + ${{ matrix.cni }} smoke test
    runs-on: ubuntu-latest
    # Calico's install task polls for tigerastatus/calico with its own
    # bounded 300s deadline, on top of its helm install --wait and a
    # further 300s kubectl wait — the slowest of the three CNIs. 30m gives
    # that headroom plus image build, cluster create/delete and the
    # victim rollout, while still failing loudly on a genuinely stuck job.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        cni: [cilium, calico, antrea]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # repo-token makes the release lookup an authenticated API call.
      # Without it the three matrix jobs resolve the same release at the
      # same moment, unauthenticated, from the runner's shared egress IP,
      # and hit the 60/hour limit: on PR #11 the antrea job died in 6s
      # with "API rate limit exceeded" before Install kind or Smoke ran,
      # while calico and cilium passed in the same workflow run. A red
      # tick that says nothing about the code is worse than a slow one.
      # helm/kind-action below has no equivalent input (see #14).
      - name: Set up Task
        uses: arduino/setup-task@v3.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # install_only skips cluster creation here — task cluster:up creates
      # the cluster itself with the repo's own per-CNI kind config.
      - name: Install kind
        uses: helm/kind-action@v1
        with:
          install_only: true

      # Drives the same Taskfile used locally, so CI cannot drift from
      # `task smoke CNI=<cni>`: builds the victim image, brings up the
      # kind cluster, installs the CNI via Helm, deploys the victim, waits
      # for it to become Available, then tears the cluster down.
      - name: Smoke
        run: task smoke CNI=${{ matrix.cni }}
